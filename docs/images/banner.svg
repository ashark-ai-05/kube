<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1117"/>
      <stop offset="100%" stop-color="#171A24"/>
    </linearGradient>
    <linearGradient id="word" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B6EE1">
        <animate attributeName="offset" values="0%;0.15;0%" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#4FD6C9">
        <animate attributeName="offset" values="50%;0.65;50%" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#A78BFA">
        <animate attributeName="offset" values="100%;0.85;100%" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#4FD6C9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4FD6C9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)"/>

  <circle cx="600" cy="95" r="220" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="600" y="128" text-anchor="middle" font-size="96" font-weight="700" fill="url(#word)">kube</text>
    <text x="600" y="172" text-anchor="middle" font-size="22" fill="#8A93A6" letter-spacing="1">Kubernetes, at terminal speed.</text>
  </g>

  <g fill="none" stroke="#4FD6C9" stroke-opacity="0.4">
    <rect x="40" y="40" width="10" height="10">
      <animate attributeName="stroke-opacity" values="0.1;0.6;0.1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="1150" y="170" width="10" height="10">
      <animate attributeName="stroke-opacity" values="0.6;0.1;0.6" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
