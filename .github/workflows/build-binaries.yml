name: Build binaries
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/kube package/kube
          cp README.md package/README.md
          tar -czf kube-${{ matrix.target }}.tar.gz -C package .
          shasum -a 256 kube-${{ matrix.target }}.tar.gz > kube-${{ matrix.target }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: kube-${{ matrix.target }}
          path: |
            kube-*.tar.gz
            kube-*.sha256
