[package]
name = "kube-tui"
version = "0.1.0"
edition = "2024"
description = "Native iced Kubernetes inspector (not affiliated with Lens, OpenLens, or k9s)"

[lib]
name = "kube_tui"
path = "src/lib.rs"

[[bin]]
name = "kube"
path = "src/main.rs"

[dependencies]
kube = { version = "4.2", features = ["runtime", "client", "derive", "oidc", "http-proxy", "socks5", "gzip"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
iced = { version = "0.13", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde_json = "1"
indexmap = "2"
chrono = "0.4"
anyhow = "1"
thiserror = "2"
http = "1"
serde_norway = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
