[package]
name = "kube-tui"
version = "0.1.0"
edition = "2024"

[lib]
name = "kube_tui"
path = "src/lib.rs"

[[bin]]
name = "kube"
path = "src/main.rs"

[dependencies]
kube = { version = "4.2", features = ["runtime", "client", "derive", "oidc", "http-proxy", "socks5", "gzip"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde_json = "1"
indexmap = "2"
chrono = "0.4"
anyhow = "1"
thiserror = "2"
